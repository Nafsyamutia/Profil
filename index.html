<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce7f3 0%, #fef3c7 40%, #e0f2fe 100%);
            color: #334155;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Animasi Latar Belakang Bintang --- */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            top: -20px;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        .star:nth-child(1) { left: 8%; animation-duration: 6s; color: #f472b6; font-size: 18px; }
        .star:nth-child(2) { left: 22%; animation-duration: 8s; animation-delay: 1.5s; color: #38bdf8; font-size: 14px; }
        .star:nth-child(3) { left: 38%; animation-duration: 5s; animation-delay: 0.5s; color: #fbbf24; font-size: 22px; }
        .star:nth-child(4) { left: 54%; animation-duration: 7s; animation-delay: 2.5s; color: #ec4899; font-size: 16px; }
        .star:nth-child(5) { left: 72%; animation-duration: 9s; animation-delay: 1s; color: #0284c7; font-size: 20px; }
        .star:nth-child(6) { left: 88%; animation-duration: 6.5s; animation-delay: 3s; color: #fbbf24; font-size: 15px; }

        /* --- Kartu Utama --- */
        .card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid #ffffff;
            border-radius: 30px;
            max-width: 480px;
            width: 100%;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(244, 114, 182, 0.2);
            z-index: 2;
            position: relative;
        }

        /* --- Banner Atas --- */
        .banner {
            height: 110px;
            background: linear-gradient(90deg, #f472b6 0%, #a855f7 50%, #38bdf8 100%);
            position: relative;
        }

        /* --- Foto Profil Utama --- */
        .avatar-box {
            position: relative;
            width: 120px;
            height: 120px;
            margin: -60px auto 12px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #ffffff;
            box-shadow: 0 10px 25px rgba(236, 72, 153, 0.25);
            object-fit: cover;
            animation: bounce 3s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .card-body {
            padding: 0 30px 35px 30px;
            text-align: center;
        }

        .badge {
            background: #fbcfe8;
            border: 1px solid #f472b6;
            color: #be185d;
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.2px;
            display: inline-block;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 4px;
            background: linear-gradient(to right, #ec4899, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 22px;
        }

        .tag {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #0369a1;
            font-weight: 600;
        }

        /* --- Player Musik Dekoratif --- */
        .music-card {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            border-radius: 18px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.12);
        }

        .vinyl {
            width: 36px;
            height: 36px;
            background: #1e293b;
            border-radius: 50%;
            border: 3px solid #ec4899;
            animation: spin 4s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vinyl::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #ffffff;
            border-radius: 50%;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .music-info {
            text-align: left;
            flex-grow: 1;
        }

        .music-title {
            font-size: 12px;
            font-weight: 700;
            color: #78350f;
        }

        .music-artist {
            font-size: 11px;
            color: #94a3b8;
        }

        /* --- Galeri Foto --- */
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #ec4899;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .gallery-card {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            height: 100px;
            border: 2px solid #ffffff;
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-card:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 20px rgba(56, 189, 248, 0.3);
        }

        .gallery-card:hover img {
            transform: scale(1.12);
        }

        /* --- Tombol Kontak --- */
        .btn {
            background: linear-gradient(90deg, #f472b6 0%, #38bdf8 100%);
            color: white;
            text-decoration: none;
            padding: 13px 24px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            display: block;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(244, 114, 182, 0.45);
        }

        .footer-text {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 14px;
        }
    </style>
</head>
<body>

    <!-- Efek Bintang Jatuh -->
    <div class="stars-container">
        <div class="star">★</div>
        <div class="star">✦</div>
        <div class="star">★</div>
        <div class="star">✦</div>
        <div class="star">★</div>
        <div class="star">✦</div>
    </div>

    <!-- Kartu Utama -->
    <div class="card">
        <div class="banner"></div>
        
        <div class="card-body">
            <!-- Foto Utama (foto.jpg) -->
            <div class="avatar-box">
                <img class="avatar-img" src="foto.jpg" alt="Foto Profil Nafsya">
            </div>

            <span class="badge">MAHASISWA</span>
            <h1>Nafsya Amelia Sari Mutia</h1>
            <p class="subtitle">Manajemen Informasi Komunikasi</p>

            <div class="tags">
                <span class="tag">☁️ Cloud Computing</span>
                <span class="tag">🌐 Web</span>
                <span class="tag">📊 Data</span>
            </div>

            <!-- Pemutar Musik Estetik -->
            <div class="music-card">
                <div class="vinyl"></div>
                <div class="music-info">
                    <div class="music-title">Favorite Vibe ✨</div>
                    <div class="music-artist">Nafsya's Playlist • Chill & Coding</div>
                </div>
            </div>

            <!-- Galeri Foto (foto1.jpg, foto2.jpg, foto3.jpg) -->
            <div class="section-title">📸 Galeri Kegiatan</div>
            <div class="gallery-grid">
                <div class="gallery-card">
                    <img src="foto1.jpg" alt="Kegiatan 1">
                </div>
                <div class="gallery-card">
                    <img src="foto2.jpg" alt="Kegiatan 2">
                </div>
                <div class="gallery-card">
                    <img src="foto3.jpg" alt="Kegiatan 3">
                </div>
            </div>

            <!-- Tombol Aksi -->
            <a href="mailto:025241461139@mail.mmtc.ac.id" class="btn">Hubungi Saya ✉️</a>
            <p class="footer-text">Sekolah Tinggi Multi Media Yogyakarta</p>
        </div>
    </div>

</body>
</html>
