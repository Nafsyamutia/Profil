<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #fce7f3 0%, #fef3c7 50%, #e0f2fe 100%);
            color: #334155;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- Animasi Bintang Berjatuhan --- */
        .stars-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            top: -20px;
            color: #ec4899;
            font-size: 14px;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Variasi posisi dan durasi bintang jatuh */
        .star:nth-child(1) { left: 10%; animation-duration: 6s; animation-delay: 0s; color: #f472b6; font-size: 18px; }
        .star:nth-child(2) { left: 25%; animation-duration: 8s; animation-delay: 2s; color: #38bdf8; font-size: 14px; }
        .star:nth-child(3) { left: 40%; animation-duration: 5s; animation-delay: 1s; color: #fbbf24; font-size: 20px; }
        .star:nth-child(4) { left: 55%; animation-duration: 7s; animation-delay: 3s; color: #f472b6; font-size: 12px; }
        .star:nth-child(5) { left: 70%; animation-duration: 9s; animation-delay: 0.5s; color: #38bdf8; font-size: 16px; }
        .star:nth-child(6) { left: 85%; animation-duration: 6.5s; animation-delay: 2.5s; color: #fbbf24; font-size: 22px; }
        .star:nth-child(7) { left: 95%; animation-duration: 7.5s; animation-delay: 1.5s; color: #f472b6; font-size: 15px; }

        /* --- Kartu Utama --- */
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid #ffffff;
            border-radius: 24px;
            padding: 35px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(244, 114, 182, 0.15);
            z-index: 2;
            position: relative;
        }

        /* --- Karakter Animasi --- */
        .avatar-box {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #ffffff;
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3);
            background: #fbcfe8;
            object-fit: cover;
            animation: float 3s ease-in-out infinite;
        }

        /* Animasi Melayang (Floating) Karakter */
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .badge {
            background: #fbcfe8;
            border: 1px solid #f472b6;
            color: #be185d;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ec4899, #0284c7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .tag {
            background: #e0f2fe;
            border: 1px solid #bae6fd;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 12px;
            color: #0369a1;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 12px 6px;
            border-radius: 16px;
        }

        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #ec4899;
        }

        .stat-label {
            font-size: 11px;
            color: #78350f;
            margin-top: 4px;
            font-weight: 500;
        }

        .btn {
            background: linear-gradient(90deg, #f472b6 0%, #38bdf8 100%);
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            display: block;
            margin-bottom: 12px;
            box-shadow: 0 8px 18px rgba(56, 189, 248, 0.3);
            transition: transform 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .email {
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- Efek Bintang Jatuh -->
    <div class="stars-container">
        <div class="star">★</div>
        <div class="star">✦</div>
        <div class="star">★</div>
        <div class="star">✦</div>
        <div class="star">★</div>
        <div class="star">✦</div>
        <div class="star">★</div>
    </div>

    <!-- Kartu Profil -->
    <div class="card">
        <!-- Karakter Animasi Melayang -->
        <div class="avatar-box">
            <img class="avatar-img" src="https://api.dicebear.com/7.x/bottts/svg?seed=Nafsya" alt="Karakter Animasi">
        </div>

        <span class="badge">MAHASISWA</span>
        <h1>Nafsya Amelia</h1>
        <p class="subtitle">Manajemen Informasi Komunikasi</p>

        <div class="tags">
            <span class="tag">☁️ Cloud Computing</span>
            <span class="tag">🌐 Web</span>
            <span class="tag">📊 Data</span>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-number">100+</div>
                <div class="stat-label">Proyek</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">100%</div>
                <div class="stat-label">Semangat</div>
            </div>
            <div class="stat-box">
                <div class="stat-number">STMM</div>
                <div class="stat-label">Kampus</div>
            </div>
        </div>

        <a href="mailto:mahasiswa@email.com" class="btn">Hubungi Saya</a>
        <p class="email">mahasiswa@email.com</p>
    </div>

</body>
</html>
